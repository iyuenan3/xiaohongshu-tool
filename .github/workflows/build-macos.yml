name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 创建 GitHub Release 需要

jobs:
  build:
    runs-on: macos-14   # arm64 runner; 也跑 x64 dmg via electron-builder
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Go (current arch, arm64)
        working-directory: xiaohongshu-mcp
        run: go build -o ../app/resources/bin/xiaohongshu-mcp .

      - name: Install app deps
        working-directory: app
        run: npm ci --no-audit

      - name: Build Electron + DMG (arm64 + x64)
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:mac

      - name: List artifacts
        working-directory: app
        run: ls -lh release/*/*.dmg release/*/*.zip release/*/*.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xhs-app-macos
          path: |
            app/release/*/*.dmg
            app/release/*/*.zip
            app/release/*/latest-mac.yml
            app/release/*/*.blockmap
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/release/*/*.dmg
            app/release/*/*.zip
            app/release/*/latest-mac.yml
            app/release/*/*.blockmap
          draft: false
          body: "Windows / macOS 安装包。auto-update 通过 latest.yml / latest-mac.yml 工作。"
