name: Build macOS

on:
  workflow_dispatch:    # 仅手动触发, 节省 macOS runner quota (私仓 free tier 倍率 10x)
    inputs:
      release_tag:
        description: '发布到 GitHub Release 的 tag (例如 v0.3.2). 留空则只 build artifacts 不发版.'
        required: false
        type: string
        default: ''

permissions:
  contents: write  # 创建 GitHub Release 需要

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14    # Apple Silicon (arm64)
            arch: arm64
            go_arch: arm64
          # Intel (macos-13/x64) 默认不编: GH 私仓 Intel runner 排队卡 8~13h, arm64 已覆盖 2020+ Mac。
          # 需要 Intel 包时取消下面注释 (用户须特地说明), 再触发 build:
          # - os: macos-13
          #   arch: x64
          #   go_arch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Go (${{ matrix.arch }})
        working-directory: xiaohongshu-mcp
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.go_arch }}
        run: go build -o ../app/resources/bin/xiaohongshu-mcp .

      - name: Install app deps (skip prebuild-install)
        working-directory: app
        run: npm ci --no-audit --ignore-scripts

      - name: Rebuild native modules for Electron (${{ matrix.arch }})
        working-directory: app
        run: ./node_modules/.bin/electron-builder install-app-deps --arch=${{ matrix.arch }}

      - name: Build Electron renderer + main + preload
        working-directory: app
        run: ./node_modules/.bin/electron-vite build

      - name: Package DMG (${{ matrix.arch }})
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./node_modules/.bin/electron-builder --mac --${{ matrix.arch }} --publish never

      - name: List artifacts
        working-directory: app
        run: ls -lh release/*/*.dmg release/*/*.zip release/*/*.yml 2>&1

      - name: Upload artifacts
        continue-on-error: true   # CI 临时 artifact 撞存储配额也不阻断下面的 Create Release (Release 直传 DMG、不占 artifact quota)
        uses: actions/upload-artifact@v4
        with:
          name: xhs-app-macos-${{ matrix.arch }}
          path: |
            app/release/*/*.dmg
            app/release/*/*.zip
            app/release/*/latest-mac.yml
            app/release/*/*.blockmap
          retention-days: 14

      - name: Create / Update GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            app/release/*/*.dmg
            app/release/*/*.zip
            app/release/*/latest-mac.yml
            app/release/*/*.blockmap
          draft: false
          body: "Windows / macOS 安装包。auto-update 通过 latest.yml / latest-mac.yml 工作。"
