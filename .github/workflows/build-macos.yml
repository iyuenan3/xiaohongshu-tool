name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 创建 GitHub Release 需要

jobs:
  build:
    runs-on: macos-14   # arm64 (Apple Silicon). 仅 build arm64, 避 cross-arch native module 污染
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Go (arm64)
        working-directory: xiaohongshu-mcp
        run: go build -o ../app/resources/bin/xiaohongshu-mcp .

      - name: Install app deps (force build native from source)
        working-directory: app
        # 强制 native module 从源码 build, 避免 prebuilt arch 错位
        env:
          npm_config_build_from_source: 'true'
        run: npm ci --no-audit

      - name: Build Electron + DMG (arm64 only)
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./node_modules/.bin/electron-builder --mac --arm64 --publish never

      - name: List artifacts
        working-directory: app
        run: ls -lh release/*/*.dmg release/*/*.zip release/*/*.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xhs-app-macos
          path: |
            app/release/*/*.dmg
            app/release/*/*.zip
            app/release/*/latest-mac.yml
            app/release/*/*.blockmap
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/release/*/*.dmg
            app/release/*/*.zip
            app/release/*/latest-mac.yml
            app/release/*/*.blockmap
          draft: false
          body: "Windows / macOS 安装包。auto-update 通过 latest.yml / latest-mac.yml 工作。"
