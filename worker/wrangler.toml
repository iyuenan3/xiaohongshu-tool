name = "xhs-license"
main = "src/index.ts"
compatibility_date = "2025-05-01"
account_id = "597366cb37ce88965f9f0ba73a45662c"

# Custom Domain (maxwellii.com 已托管在 Cloudflare DNS, 自动配 DNS + SSL)
routes = [
  { pattern = "xhslicense.maxwellii.com", custom_domain = true }
]

# KV namespace
[[kv_namespaces]]
binding = "LICENSES"
id = "a42560054b8241e89ddbe9317d35af21"

# Secrets (通过 `wrangler secret put <NAME>` 设置, 不入 git):
# - SIGNING_PRIVATE_KEY: Ed25519 私钥 base64 (32 字节 raw)
# - ADMIN_TOKEN:         管理端 API token (建议 openssl rand -base64 32)

[observability]
enabled = true
